name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Match the service containers below. CI-only throwaway credentials.
  DATABASE_URL: postgres://gatecrusher:gatecrusher@localhost:5432/gatecrusher
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gatecrusher
          POSTGRES_PASSWORD: gatecrusher
          POSTGRES_DB: gatecrusher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatecrusher -d gatecrusher"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # The adapter and worker integration tests drive a headless Chromium against
      # local fixture pages. Nothing in them reaches SoundCloud or a gate site.
      - name: Install Chromium
        run: pnpm --filter @gatecrusher/gates exec playwright install --with-deps chromium
      - name: Unit and integration tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: UI e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @gatecrusher/web exec playwright install --with-deps chromium
      # Headless, against the local UI only. The headed worker and anything touching
      # live sites never run in CI.
      - name: Playwright tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
