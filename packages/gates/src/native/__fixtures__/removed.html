<!doctype html>
<!--
  Fixture: SoundCloud's page for a track that was removed or made private. The fixture
  server answers it with HTTP 404, as SoundCloud does. Modelled 2026-10-01. Hand-written.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SoundCloud - Hear the world’s sounds</title>
  </head>
  <body>
    <header class="header">
      <div class="header__userNav">
        <button type="button" aria-label="Fixture Burner">Fixture Burner</button>
      </div>
    </header>
    <main>
      <h1 class="errorTitle">We can’t find that track.</h1>
      <p>A report may have been made against it, or it was deleted by its uploader.</p>
    </main>
  </body>
</html>
