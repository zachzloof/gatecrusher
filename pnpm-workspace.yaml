packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts.
allowBuilds:
  # Native binary used by Vite (Vitest) and drizzle-kit.
  esbuild: true
  # Downloads the Electron binary for the desktop app.
  electron: true
  # Squirrel.Windows support in electron-builder; the installer is NSIS, so unused.
  electron-winstaller: false
